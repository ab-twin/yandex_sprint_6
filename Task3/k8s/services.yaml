apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "service-a"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://simplest-collector.observability:4318"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"  # ОБЯЗАТЕЛЬНО!
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"  # ОБЯЗАТЕЛЬНО!
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"  # для распространения trace между сервисами
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

